<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>آدمک‌ساز</title>
<script src="mp4-muxer.js"></script>
<style>
/* Layout: icon-only toy. Portrait = stage, tool rows, timeline. Landscape tablet = tool column beside a full-height stage, timeline below. */
:root{
  --bg:#dfeefe; --panel:#ffffff; --ink:#1d2742; --muted:#5d6a8a;
  --node:#ff7a1a; --root:#e6334d; --go:#1fae6b; --line:#c3d6f2; --sel:#ffe7d3; --hold:#eef4fd; --clip:#ffd23f;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111a2b; --panel:#1b2740; --ink:#eef3ff; --muted:#9fb0d4; --line:#2f4066; --sel:#4a3322; --hold:#22304d; --clip:#e0b520; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#111a2b; --panel:#1b2740; --ink:#eef3ff; --muted:#9fb0d4; --line:#2f4066; --sel:#4a3322; --hold:#22304d; --clip:#e0b520; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{max-width:1500px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:8px}
.logo{width:46px;height:46px;flex:0 0 auto;margin-inline-end:auto}
.topbar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.grp{display:flex;gap:5px;flex-wrap:wrap}
.topbar .tool{width:48px;height:48px;min-height:0;padding:0;border-radius:13px;box-shadow:0 3px 0 var(--ink);flex:0 0 auto}
.topbar .tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.topbar .tool svg{width:26px;height:26px}
.topbar .tool .em{font-size:24px}
.topbar .tool.on{outline-offset:-5px}
.stagewrap{flex:1 1 auto;min-height:150px;min-width:0;container-type:size;display:flex;align-items:center;justify-content:center}
.stage{background:var(--panel);border:3px solid var(--ink);border-radius:18px;overflow:hidden;line-height:0;position:relative;box-sizing:border-box;
  width:100%;max-width:calc(100cqh * 1.6);width:min(100cqw,calc(100cqh * 1.6))}
canvas#stage{width:100%;height:auto;aspect-ratio:8/5;display:block;touch-action:none;max-width:100%}
.zoomreset{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:12px;border:3px solid var(--ink);background:var(--panel);color:var(--ink);
  font-size:22px;line-height:1;cursor:pointer;box-shadow:0 3px 0 var(--ink);padding:0}
.zoomreset:focus-visible{outline:4px solid var(--node);outline-offset:2px}
.badge{position:absolute;top:10px;left:12px;line-height:1;background:var(--ink);color:var(--panel);
  font-weight:800;padding:6px 12px;border-radius:999px;font-size:1rem;font-variant-numeric:tabular-nums}
.tool{font:inherit;color:var(--ink);background:var(--panel);border:3px solid var(--ink);border-radius:16px;
  padding:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 4px 0 var(--ink);transition:transform .08s, box-shadow .08s;min-height:58px;min-width:0}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tool:focus-visible,.mini:focus-visible,.pcard:focus-visible{outline:4px solid var(--node);outline-offset:2px}
.tool svg{width:30px;height:30px}
.tool .em{font-size:28px;line-height:1}
.tool.play{background:var(--go);color:#fff}
.tool.vid{background:var(--node);color:#fff}
.tool.warn,.tool.rec{background:var(--root);color:#fff}
.tool.on{background:var(--sel);outline:3px solid var(--node);outline-offset:-6px}
.tool:disabled{opacity:.35;cursor:default}
.tool.pulse{animation:pulse .5s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.15);background:var(--sel)}}
.dopts{flex:1 1 100%;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:5px 8px}
.dopts .sizes button{width:38px;height:38px}
.dopts .sw button,.dopts .cpick{width:30px;height:30px}
.sizes{display:flex;gap:6px}
.sizes button{width:46px;height:46px;border-radius:12px;border:3px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.sizes button i{display:block;border-radius:50%;background:var(--ink)}
.sizes button.on{border-color:var(--node);background:var(--sel)}
.sizes button:focus-visible{outline:3px solid var(--node);outline-offset:2px}
.sw{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:1;min-width:0}
.sw button,.cpick{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;padding:0;box-sizing:border-box}
.sw button.on,.cpick.on{box-shadow:0 0 0 4px var(--node)}
.sw button:focus-visible{outline:3px solid var(--node);outline-offset:3px}
.cpick{position:relative;display:flex;background:conic-gradient(#e6334d,#ffd23f,#1fae6b,#2b6fe0,#8a3fd1,#e6334d);overflow:hidden}
.cpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}

/* voice recorder */
#recWave{width:100%;height:110px;background:var(--hold);border-radius:14px;display:block}
.rtime{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.recwrap{display:flex;align-items:center;justify-content:center;padding:18px 0 10px}
.recbig{--lvl:0;--prog:0;position:relative;z-index:0;width:124px;height:124px;border-radius:50%;border:4px solid var(--ink);background:var(--panel);color:var(--ink);
  font-size:54px;line-height:1;cursor:pointer;box-shadow:0 0 0 calc(4px + var(--lvl) * 28px) rgba(230,51,77,.22),0 5px 0 var(--ink);transition:box-shadow .06s}
.recbig.on{background:var(--root)}
.recbig::before{content:"";position:absolute;inset:-14px;border-radius:50%;z-index:-1;
  background:conic-gradient(var(--root) calc(var(--prog) * 1turn),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px))}
.recbig:focus-visible{outline:4px solid var(--node);outline-offset:18px}
.clip canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.4;pointer-events:none}
.clip span,.clip .x{position:relative}

/* timeline */
.tlbox{background:var(--panel);border:3px solid var(--ink);border-radius:20px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tlhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tlhead .ic{font-size:24px;margin-inline-end:auto}
.mini{font:inherit;font-weight:800;color:var(--ink);background:var(--panel);border:3px solid var(--ink);border-radius:14px;
  min-width:46px;height:46px;padding:0 10px;cursor:pointer;box-shadow:0 3px 0 var(--ink);font-size:1.15rem;display:flex;align-items:center;justify-content:center;gap:6px}
.mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.mini:disabled{opacity:.35}
.mini.snd{background:var(--clip);color:#1d2742}
.mini.on{background:var(--sel)}
.len{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums}
.len span{min-width:2.6em;text-align:center}
.tl{position:relative;display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px}
.cell{flex:0 0 auto;border:3px solid var(--line);border-radius:12px;background:var(--panel);padding:0;cursor:pointer;
  display:flex;flex-direction:column;overflow:hidden;font:inherit;color:var(--ink);text-align:start}
.cell.on,.acell.on{border-color:var(--node);box-shadow:0 0 0 2px var(--node)}
.cell .pic{display:flex;height:50px}
.cell canvas{width:80px;height:50px;display:block;flex:0 0 80px}
.cell .hold{flex:1;background:repeating-linear-gradient(-45deg,var(--hold) 0 6px,transparent 6px 12px);border-inline-start:2px dashed var(--line)}
.num{position:relative;line-height:0}
.num i{position:absolute;top:3px;right:4px;font-style:normal;line-height:1;font-weight:800;font-size:.75rem;
  background:var(--ink);color:var(--panel);border-radius:6px;padding:2px 5px}
.cell .snds{height:24px;display:flex;align-items:center;gap:2px;padding:0 4px;font-size:16px;line-height:1;border-top:2px solid var(--line);
  background:var(--hold);white-space:nowrap;overflow:hidden}
.cell.add{width:64px;align-items:center;justify-content:center;font-size:2rem;color:var(--muted);border-style:dashed;height:80px}
.cell,.acell,.clip,.snds span{-webkit-touch-callout:none}
.cell{position:relative}
.pickmark{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);background:var(--panel);color:#fff;
  font-weight:900;font-size:14px;line-height:20px;text-align:center;z-index:2;box-sizing:border-box;pointer-events:none}
.pick .pickmark{background:var(--root);border-color:var(--root)}
.cell.pick,.acell.pick{border-color:var(--root);box-shadow:0 0 0 3px var(--root)}
.cell,.acell{touch-action:none}
.pickmark{display:none}
.selecting .pickmark{display:block}
.selecting .cell:not(.pick):not(.add),.selecting .acell:not(.pick):not(.add){opacity:.65}
.cell.dragging,.acell.dragging{opacity:.25!important}
.dragGhost{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-70%) rotate(-5deg);border:3px solid var(--node);border-radius:12px;
  background:var(--panel);box-shadow:0 10px 24px rgba(0,0,0,.28);line-height:0;overflow:hidden}
.dragGhost canvas{width:96px;height:60px;display:block}
.dragGhost b{position:absolute;top:4px;right:4px;background:var(--root);color:#fff;border-radius:99px;padding:2px 8px;font-size:.85rem;line-height:1.3}
.dropBar{position:fixed;z-index:29;width:6px;margin-left:-3px;border-radius:3px;background:var(--root);pointer-events:none;box-shadow:0 0 0 2px var(--panel)}
.selbar,.tlnorm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mini.warn{background:var(--root);color:#fff}
.snds span{border-radius:6px;padding:1px 2px;cursor:pointer}
.snds span.arm{background:var(--root);animation:wiggle .3s ease-in-out infinite}
.clip.arm{background:var(--root);color:#fff;animation:wiggle .3s ease-in-out infinite;z-index:5;justify-content:center;font-size:1.2rem}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.ph{position:absolute;top:0;bottom:8px;width:4px;margin-inline-start:-2px;background:var(--root);border-radius:2px;pointer-events:none;z-index:3}
.adv{display:flex;gap:6px;align-items:flex-start}
.advs{flex:1 1 auto;min-width:0;overflow-x:auto;padding-bottom:6px}
.lhead{flex:0 0 58px;position:relative}
.lhead .lh{position:absolute;inset-inline:0;height:30px;display:flex;align-items:center;justify-content:center;gap:2px;border-radius:8px;background:var(--hold);font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
.lhead .lh button{border:0;background:transparent;font-size:15px;cursor:pointer;width:26px;height:28px;padding:0;border-radius:6px;line-height:1}
.lhead .lh button.armed{background:var(--root)}
.lhead .ladd{position:absolute;inset-inline:0;height:28px;border:2px dashed var(--line);border-radius:8px;background:transparent;font:inherit;font-size:15px;cursor:pointer;color:var(--muted);padding:0}
.lhead .ftag{position:absolute;inset-inline:0;top:0;height:54px;display:flex;align-items:center;justify-content:center;font-size:22px}
.track{position:relative}
.acell{position:absolute;top:0;height:54px;border:3px solid var(--line);border-radius:10px;background:var(--panel);padding:0;cursor:pointer;
  overflow:hidden;box-sizing:border-box;font:inherit;color:var(--ink);background-image:repeating-linear-gradient(-45deg,var(--hold) 0 6px,transparent 6px 12px)}
.acell canvas{height:100%;width:auto;display:block}
.acell.add{display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:var(--muted);border-style:dashed;width:56px;background-image:none}
.lane{position:absolute;inset-inline:0;height:30px;border-radius:8px;background:var(--hold)}
.lane span{position:absolute;inset-inline-start:6px;top:4px;font-size:.9rem;opacity:.5}
.clip{position:absolute;height:28px;box-sizing:border-box;border:2px solid var(--ink);border-radius:8px;background:var(--clip);color:#1d2742;
  display:flex;align-items:center;gap:4px;padding:0 6px;font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;cursor:grab;touch-action:none;z-index:2}
.clip.sel{box-shadow:0 0 0 3px var(--node);z-index:4}
.clip .x{margin-inline-start:auto;border:0;background:var(--root);color:#fff;border-radius:50%;width:22px;height:22px;flex:0 0 22px;font:inherit;font-weight:800;cursor:pointer;padding:0;line-height:1}

/* dialogs */
.modal{position:fixed;inset:0;background:rgba(10,16,30,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.card{background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:22px;padding:16px;width:min(560px,100%);
  display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;max-height:100%;overflow:auto;box-sizing:border-box}
.card.wide{width:min(760px,100%)}
.card h2{font-weight:800;font-size:1.4rem;margin:0}
.card p{margin:0;color:var(--muted)}
.status{font-size:1.6rem;min-height:1.3em;line-height:1.3}
.bar{height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.bar div{height:100%;width:0;background:var(--node);transition:width .1s}
.card video{width:100%;border-radius:12px;background:#000;max-width:100%}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.acts .tool{flex:1 1 110px;min-height:58px}
.sfx{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:460px){.sfx{grid-template-columns:repeat(4,1fr)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:44px}
.chip{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:4px 6px 4px 12px;font-weight:600;background:var(--hold)}
.chip button{font:inherit;border:0;background:var(--root);color:#fff;border-radius:50%;width:30px;height:30px;cursor:pointer;font-weight:800}
.chip .pl{background:var(--go)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg .tool{min-height:76px;flex-direction:column;gap:4px}
.seg .tool b{font-size:1rem}
.checks{display:flex;flex-direction:column;gap:6px;text-align:start}
.checks label{display:flex;align-items:center;gap:12px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;font-weight:600;cursor:pointer}
.checks input{width:26px;height:26px;accent-color:var(--node);flex:0 0 auto}
.checks.off label{opacity:.55}

/* object library */
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tabs .mini{font-size:1.5rem;height:52px;min-width:56px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.ltile{position:relative;aspect-ratio:1;border:3px solid var(--line);border-radius:14px;background:var(--hold);cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:var(--muted)}
.ltile img,.ltile canvas{width:100%;height:100%;object-fit:contain;display:block}
.ltile:active{transform:scale(.95)}
.ltile .x{position:absolute;top:-6px;left:-6px;width:28px;height:28px;border-radius:50%;border:0;background:var(--root);color:#fff;font-weight:800;cursor:pointer;font-size:1rem;line-height:1}
.ltile .x.armed{box-shadow:0 0 0 4px var(--clip)}
.ltile .tag{position:absolute;bottom:3px;right:5px;font-size:1rem}

/* projects */
.home{position:fixed;inset:0;background:var(--bg);z-index:15;overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.home .hbar{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto 14px}
.home .hbar .mini{height:56px;min-width:60px;font-size:1.6rem;position:relative}
.home .hbar .mini i{position:absolute;top:-8px;left:-8px;background:var(--root);color:#fff;font-style:normal;font-size:.8rem;border-radius:99px;padding:2px 7px;font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;max-width:1100px;margin:0 auto}
.pcard{position:relative;border:3px solid var(--ink);border-radius:18px;background:var(--panel);overflow:hidden;cursor:pointer;padding:0;font:inherit;color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.pcard.cur{outline:4px solid var(--node);outline-offset:2px}
.pcard .th{display:block;width:100%;aspect-ratio:8/5;object-fit:cover;background:var(--hold)}
.pcard .meta{display:flex;align-items:center;gap:8px;padding:6px 10px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.pcard .meta .btns{margin-inline-start:auto;display:flex;gap:6px}
.pcard .meta button{width:42px;height:42px;border-radius:12px;border:2px solid var(--ink);background:var(--panel);font-size:1.25rem;cursor:pointer;line-height:1}
.pcard .meta button.armed{background:var(--root);color:#fff}
.pcard.newp{display:flex;align-items:center;justify-content:center;font-size:3.5rem;color:var(--muted);border-style:dashed;min-height:150px;box-shadow:none;background:transparent}
.empty{font-size:4rem;opacity:.35;text-align:center;padding:40px 0}

.tlbox{flex:0 0 auto}
@media (max-height:640px){
  .topbar .tool{width:42px;height:42px;border-radius:11px} .topbar .tool .em{font-size:21px} .topbar .tool svg{width:22px;height:22px}
  .tlbox{padding:5px 8px;gap:4px} .tlhead .mini{height:38px;min-width:38px;font-size:1rem} .tlhead .ic{font-size:20px}
  .cell .pic{height:40px} .cell canvas{width:64px;height:40px;flex-basis:64px} .cell .snds{height:20px;font-size:14px} .cell.add{height:66px}
}
@media (prefers-reduced-motion:reduce){.tool,.bar div{transition:none}.tool.pulse,.clip.arm,.snds span.arm{animation:none}}
</style>

<div class="app">
  <div class="topbar">
    <div class="grp">
      <button class="tool" id="bHome" aria-label="پروژه‌ها" title="پروژه‌ها"><span class="em">🏠</span></button>
      <button class="tool" id="bSet" aria-label="تنظیمات" title="تنظیمات"><span class="em">⚙️</span></button>
    </div>
    <div class="grp">
      <button class="tool play" id="bPlay" aria-label="پخش" title="پخش"><span id="playIco"></span></button>
      <button class="tool" id="bLoop" aria-label="تکرار یا یک بار" title="تکرار یا یک بار"><span class="em" id="loopIco">🔁</span></button>
      <button class="tool" id="bUndo" aria-label="برگرد" title="برگرد"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l5 5-5 5"/><path d="M20 10H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button class="tool" id="bRedo" aria-label="دوباره" title="دوباره"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5L4 10l5 5"/><path d="M4 10h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="tool" id="bAdd" aria-label="فریم تازه" title="فریم تازه"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="7" y="5" width="14" height="14" rx="2"/><path d="M4 8v8M0.5 12h7" transform="translate(0.5 0)"/></svg></button>

function autoRig(){stop();const fr=S.frames[S.cur],b=$('bRig');

  if(isRigged()){unRig();return;}
  if(!fr.d.length){nope();return;}

    let bf=-1,bd=1e9;js.forEach((j,fi)=>{if(S.figs[fi].hidden)return;let sum=0;pts.forEach(([x,y])=>sum+=figDist(j,x,y));const avg=sum/pts.length;if(avg<bd){bd=avg;bf=fi;}});

    if(bx[3]-bx[1]>=50&&bx[2]-bx[0]>=20)fresh.push({bx,members:g.map(i=>rest[i])});});

  take.forEach(([si,fi])=>{const s=fr.d[si],fig=S.figs[fi];if(!fig.skin)fig.skin=[];if(!fig.id)fig.id=newId('f');keys.add(JSON.stringify(s));bindInto(fig,js[fi],s);});
  fresh.forEach(({bx,members})=>{if(S.figs.length>=COLORS.length)return;
    const {p,sc}=fitPose(bx),used=S.figs.map(f=>f.color),fig={id:newId('f'),auto:true,color:COLORS.find(c=>!used.includes(c))||COLORS[0],sc,skin:[]},j=solve(p,sc);

    S.figs.push(fig);S.frames.forEach(f=>f.p.push(clone(p)));});

$('sFileIn').onchange=e=>{const file=e.target.files[0];e.target.value='';if(!file)return;
  if(file.size>15*1024*1024){$('sMsg').textContent='🚫';return;}
  addClip(file,(file.name||'').replace(/\.[^.]+$/,'').slice(0,18),false);};
/* ---------- voice recorder: one big button, live waveform, preview, add ---------- */
const recBox=$('recBox'),rw=$('recWave'),rwx=rw.getContext('2d');
let rec=null,recStream=null,recSrc=null,recT0=0,recRAF=0,recBlob=null,recBuf=null,recLv=[],recPlayNode=null;
const REC_MAX=20000,BARS=90;
function drawBars(levels,progress){const cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue('--ink').trim()||'#1d2742';
  const w=rw.width,h=rw.height;rwx.clearRect(0,0,w,h);const bw=w/BARS;
  rwx.fillStyle='#ff7a1a';for(let i=0;i<BARS;i++){const v=Math.max(.03,levels[i]||0),bh=v*h*.9;rwx.fillRect(i*bw+bw*.15,(h-bh)/2,bw*.7,bh);}
  if(progress!=null){rwx.fillStyle=ink;rwx.fillRect(Math.max(0,progress*w-2),0,4,h);}}
function peaks(b,n){const d=b.getChannelData(0),step=Math.max(1,Math.floor(d.length/n)),out=[];let mx=0;
  for(let i=0;i<n;i++){let p=0;const e=Math.min(d.length,(i+1)*step);for(let j=i*step;j<e;j+=4)p=Math.max(p,Math.abs(d[j]));out.push(p);if(p>mx)mx=p;}
  return out.map(v=>mx?v/mx:0);}
function recUI(state){const b=$('recBtn');b.classList.toggle('on',state==='rec');b.textContent=state==='rec'?'⏹️':'🎤';
  b.hidden=state==='done'||state==='fail';$('recAfter').hidden=state!=='done';$('recFail').hidden=state!=='fail';
  if(state==='idle'){$('recTime').textContent=fa(0);b.style.setProperty('--prog',0);b.style.setProperty('--lvl',0);drawBars([]);}
  if(state==='fail'){$('recTime').textContent='🎤🚫';drawBars([]);}}
function stopPreview(){try{recPlayNode&&recPlayNode.stop();}catch(e){}recPlayNode=null;}
function openRecorder(){stop();getAC();recBlob=null;recBuf=null;recUI('idle');recBox.hidden=false;}
async function startRec(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){recUI('fail');return;}
  try{recStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}catch(e){recUI('fail');return;}
  const c=getAC(),an=c.createAnalyser();an.fftSize=1024;recSrc=c.createMediaStreamSource(recStream);recSrc.connect(an);
  const parts=[];rec=new MediaRecorder(recStream);rec.ondataavailable=e=>e.data.size&&parts.push(e.data);
  rec.onstop=async()=>{cancelAnimationFrame(recRAF);recStream.getTracks().forEach(t=>t.stop());try{recSrc.disconnect();}catch(e){}
    if(!parts.length){recUI('idle');return;}
    recBlob=new Blob(parts,{type:parts[0].type||rec.mimeType});
    try{recBuf=await decode(recBlob);}catch(e){recBuf=null;}
    if(!recBuf){recUI('fail');return;}
    recUI('done');drawBars(peaks(recBuf,BARS));$('recTime').textContent=fa(Math.round(recBuf.duration*10)/10).replace('.','٫');};
  recLv=[];rec.start();recT0=performance.now();recUI('rec');
  const buf=new Uint8Array(an.fftSize);
  const loop=()=>{if(!rec||rec.state!=='recording')return;an.getByteTimeDomainData(buf);let sum=0;
    for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sum+=v*v;}
    const lvl=Math.min(1,Math.sqrt(sum/buf.length)*4);recLv.push(lvl);if(recLv.length>BARS)recLv.shift();
    const el=performance.now()-recT0,b=$('recBtn');b.style.setProperty('--lvl',lvl.toFixed(3));b.style.setProperty('--prog',Math.min(1,el/REC_MAX).toFixed(4));
    $('recTime').textContent=fa(Math.floor(el/1000));drawBars(recLv);
    if(el>=REC_MAX){rec.stop();return;}recRAF=requestAnimationFrame(loop);};
  loop();}
$('recBtn').onclick=()=>{if(rec&&rec.state==='recording'){rec.stop();return;}startRec();};
$('recPlay').onclick=()=>{if(!recBuf)return;const c=getAC();stopPreview();
  const src=c.createBufferSource();src.buffer=recBuf;src.connect(c.destination);const t0=c.currentTime+.02;src.start(t0);recPlayNode=src;const pk=peaks(recBuf,BARS);
  const loop=()=>{if(recPlayNode!==src||recBox.hidden)return;const p=(c.currentTime-t0)/recBuf.duration;if(p>=1){drawBars(pk);return;}drawBars(pk,Math.max(0,p));requestAnimationFrame(loop);};loop();};
$('recAgain').onclick=()=>{stopPreview();recUI('idle');};
$('recOk').onclick=async()=>{if(!recBlob||!recBuf)return;stopPreview();
  const id=newId('c');clipBuf[id]=recBuf;await dbPut('clips',id,recBlob);
  const {st}=starts(),s={k:'clip',id,name:'',rec:true,t:st[S.cur]};snap();placeSound(s);S.snd.push(s);
  recBox.hidden=true;update();if(!sndBox.hidden)sndRender();};
$('recFile').onclick=()=>{recBox.hidden=true;$('sFileIn').click();};
$('recClose').onclick=()=>{if(rec&&rec.state==='recording'){rec.onstop=null;rec.stop();cancelAnimationFrame(recRAF);recStream&&recStream.getTracks().forEach(t=>t.stop());try{recSrc.disconnect();}catch(e){}}
  stopPreview();recBox.hidden=true;};
$('bMic').onclick=openRecorder;
$('sRec').onclick=()=>{sndBox.hidden=true;openRecorder();};

/* ---------- playback ---------- */
const ICO_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICO_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>';
const playIco=$('playIco');playIco.innerHTML=ICO_PLAY;
function tick(now){
  if(!playing)return;
  playT+=Math.max(0,Math.min(100,now-last));last=now;
  const totalMs=starts().total*unitMs();
  const {i,raw,pos,fr}=frameAt(playT);render(fr);
  if(bus){const wrap=pos<lastPos;S.snd.forEach(s=>{const hit=wrap?(s.t>lastPos||s.t<=pos):(s.t>lastPos&&s.t<=pos);if(hit)playSound(AC,bus,AC.currentTime+.01,s);});}
  lastPos=pos;
  if(i!==lastFrame){lastFrame=i;markThumb(i);$('badge').textContent=fa(i+1)+' / '+fa(S.frames.length);
    if(!on('advtl')){const cell=strip.children[i];cell&&cell.scrollIntoView({block:'nearest',inline:'nearest'});}}
  placePH(i,raw,pos);
  if(!S.loop&&playT>=totalMs){const tail=bus;bus=null;stop(true);if(tail)setTimeout(()=>{try{tail.disconnect();}catch(e){}},1500);return;}
  requestAnimationFrame(tick);
}
function stop(keepFrame){if(!playing)return;playing=false;playIco.innerHTML=ICO_PLAY;ph.hidden=true;
  if(bus){try{bus.disconnect();}catch(e){}bus=null;}
  markThumb(S.cur);$('badge').textContent=fa(S.cur+1)+' / '+fa(S.frames.length);
  if(keepFrame===true){setTimeout(()=>{if(!playing)render();},900);}else render();}
$('bPlay').onclick=()=>{if(playing){stop();return;}
  if(S.frames.length<2){const b=$('bAdd');b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse');return;}
  const c=getAC();if(c){bus=c.createGain();bus.gain.value=.9;bus.connect(c.destination);}
  selProp=-1;armedSnd=-1;if(selFrames){selFrames=null;selUI();buildTimeline();}playing=true;playT=0;lastFrame=-1;lastPos=-1;last=performance.now();playIco.innerHTML=ICO_PAUSE;requestAnimationFrame(tick);};
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.code==='Space'||e.code==='Enter'))return;
  if(!sndBox.hidden||!$('modal').hidden||!setBox.hidden||!libBox.hidden||!$('home').hidden||!recBox.hidden)return;
  if(e.code==='Space'){e.preventDefault();$('bPlay').click();}
  const z=(e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z');
  if(z&&!e.shiftKey){e.preventDefault();undo();}
  if((z&&e.shiftKey)||((e.ctrlKey||e.metaKey)&&e.key==='y')){e.preventDefault();redo();}});
window.addEventListener('resize',()=>{if(!playing)render();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow();});
window.addEventListener('pagehide',()=>saveNow());

/* ---------- video export (MP4 with sound) ---------- */
const modal=$('modal');let videoBlob=null,videoExt='mp4',videoURL='';
function showModal(state,text){modal.hidden=false;
  $('mTitle').textContent=state==='work'?'⏳🎬':state==='done'?'✅🎬':'❌';
  $('mText').textContent=text||'';$('mBar').hidden=state!=='work';
  $('mVideo').hidden=state!=='done';$('mSave').hidden=state!=='done';$('mClose').hidden=state==='work';}
$('mClose').onclick=()=>{modal.hidden=true;$('mVideo').pause();};
const VW=960,VH=600,FPS=30,SR=48000;
function plan(){const loop=starts().total*unitMs(),loops=S.loop?Math.max(1,Math.ceil(4000/loop)):1;return {loop,loops,total:loop*loops,count:Math.ceil(loop*loops/1000*FPS)};}
function paintVideo(c,ms){c.setTransform(VW/W,0,0,VH/H,0,0);drawFrame(c,S.frames.length>1?frameAt(ms).fr:S.frames[0]);}
async function renderMix(P){
  const O=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!O)return null;
  const len=Math.ceil(SR*(P.total+(S.loop?0:1500))/1000),c=new O(2,len,SR),out=c.createGain(),u=unitMs();out.gain.value=.9;out.connect(c.destination);
  for(let L=0;L<P.loops;L++)S.snd.forEach(s=>{if(s.t*u<P.loop)playSound(c,out,(L*P.loop+s.t*u)/1000+.005,s);});
  return await new Promise((res,rej)=>{c.oncomplete=e=>res(e.renderedBuffer);const p=c.startRendering();if(p&&p.then)p.then(res,rej);});
}
async function encodeWebCodecs(oc,octx,P,mix){
  const configs=['avc1.42001f','avc1.4d0028','avc1.640028'].map(codec=>({codec,width:VW,height:VH,bitrate:4_000_000,framerate:FPS}));
  let cfg=null;for(const c of configs){try{if((await VideoEncoder.isConfigSupported(c)).supported){cfg=c;break;}}catch(e){}}
  if(!cfg)return null;
  let aCfg=null;
  if(mix){if(!window.AudioEncoder||!window.AudioData)return null;
    const a={codec:'mp4a.40.2',sampleRate:SR,numberOfChannels:2,bitrate:128000};
    try{if((await AudioEncoder.isConfigSupported(a)).supported)aCfg=a;}catch(e){}
    if(!aCfg)return null;}
  const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:VW,height:VH},
    audio:aCfg?{codec:'aac',numberOfChannels:2,sampleRate:SR}:undefined,fastStart:'in-memory'});
  let fail=null;
  if(aCfg){const ae=new AudioEncoder({output:(ch,m)=>muxer.addAudioChunk(ch,m),error:e=>{fail=e;}});ae.configure(aCfg);
    const Lc=mix.getChannelData(0),Rc=mix.getChannelData(1);
    for(let off=0;off<mix.length;off+=1024){const n=Math.min(1024,mix.length-off),data=new Float32Array(n*2);
      data.set(Lc.subarray(off,off+n),0);data.set(Rc.subarray(off,off+n),n);
      const ad=new AudioData({format:'f32-planar',sampleRate:SR,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(off/SR*1e6),data});
      ae.encode(ad);ad.close();}
    await ae.flush();ae.close();if(fail)throw fail;}
  const enc=new VideoEncoder({output:(ch,meta)=>muxer.addVideoChunk(ch,meta),error:e=>{fail=e;}});
  enc.configure(cfg);
  const count=mix?Math.max(P.count,Math.ceil(mix.duration*FPS)):P.count;
  for(let f=0;f<count;f++){
    if(fail)throw fail;
    paintVideo(octx,Math.min(f*1000/FPS,P.total-1));
    const vf=new VideoFrame(oc,{timestamp:Math.round(f*1e6/FPS),duration:Math.round(1e6/FPS)});
    enc.encode(vf,{keyFrame:f%60===0});vf.close();
    while(enc.encodeQueueSize>8)await new Promise(r=>setTimeout(r,5));
    if(f%5===0){$('mFill').style.width=Math.round(f/count*100)+'%';await new Promise(r=>setTimeout(r,0));}
  }
  await enc.flush();if(fail)throw fail;muxer.finalize();enc.close();
  return {blob:new Blob([muxer.target.buffer],{type:'video/mp4'}),ext:'mp4'};
}
async function encodeRecorder(oc,octx,P,mix){
  if(!window.MediaRecorder||!oc.captureStream)return null;
  const types=[['video/mp4;codecs=avc1,mp4a.40.2','mp4'],['video/mp4;codecs=avc1','mp4'],['video/mp4','mp4'],['video/webm;codecs=vp9,opus','webm'],['video/webm','webm']];
  const t=types.find(([m])=>MediaRecorder.isTypeSupported(m));if(!t)return null;
  const vs=oc.captureStream(FPS),tracks=[...vs.getVideoTracks()];let src=null;
  if(mix){const c=getAC();if(c&&c.createMediaStreamDestination){const d=c.createMediaStreamDestination();src=c.createBufferSource();src.buffer=mix;src.connect(d);tracks.push(...d.stream.getAudioTracks());}}
  const stream=new MediaStream(tracks),rec=new MediaRecorder(stream,{mimeType:t[0],videoBitsPerSecond:4_000_000}),parts=[];
  rec.ondataavailable=e=>e.data.size&&parts.push(e.data);
  const dur=mix?Math.max(P.total,mix.duration*1000):P.total;
  const done=new Promise(r=>rec.onstop=r);paintVideo(octx,0);rec.start(200);src&&src.start();
  const t0=performance.now();
  await new Promise(res=>{const step=()=>{const ms=performance.now()-t0;paintVideo(octx,Math.min(ms,P.total-1));
    $('mFill').style.width=Math.min(100,Math.round(ms/dur*100))+'%';if(ms<dur)requestAnimationFrame(step);else res();};step();});
  rec.stop();await done;stream.getTracks().forEach(x=>x.stop());try{src&&src.stop();}catch(e){}
  return {blob:new Blob(parts,{type:t[0].split(';')[0]}),ext:t[1]};
}
$('bVid').onclick=async()=>{
  stop();getAC();selProp=-1;showModal('work');$('mFill').style.width='0%';
  await loadClips();
  const oc=document.createElement('canvas');oc.width=VW;oc.height=VH;const octx=oc.getContext('2d');
  const P=plan();let mix=null,out=null;
  if(S.snd.length){try{mix=await renderMix(P);}catch(e){mix=null;}}
  try{if(window.VideoEncoder&&window.VideoFrame&&window.Mp4Muxer)out=await encodeWebCodecs(oc,octx,P,mix);}catch(e){out=null;}
  try{if(!out)out=await encodeRecorder(oc,octx,P,mix);}catch(e){out=null;}
  if(!out){showModal('err');return;}
  videoBlob=out.blob;videoExt=out.ext;if(videoURL)URL.revokeObjectURL(videoURL);videoURL=URL.createObjectURL(videoBlob);
  $('mVideo').src=videoURL;showModal('done',videoExt==='mp4'?'':'WebM');
  $('mVideo').play().catch(()=>{});
};
let downloads=null;
if(window.claude&&claude.use){claude.use('downloads').then(d=>{downloads=d;}).catch(()=>{});}
const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b);});
$('mSave').onclick=async()=>{
  if(!videoBlob)return;
  const d=new Date(),p2=n=>String(n).padStart(2,'0'),name='adamak-'+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'-'+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds())+'.'+videoExt;
  if(window.AdamakNative){
    $('mText').textContent='⏳';
    try{const r=window.AdamakNative.saveVideo(await blobB64(videoBlob),name,videoBlob.type||'video/mp4');
      $('mText').textContent=r==='ok'?'✅ 🖼️':r==='perm'?'🔓 → 💾':'❌';}
    catch(e){$('mText').textContent='❌';}
    return;}
  if(!downloads){$('mText').textContent='❌';return;}
  try{await downloads.save({filename:name,data:videoBlob});$('mText').textContent='✅';}
  catch(e){const c=e&&e.code;$('mText').textContent=c==='declined'?'✖️':c==='rate_limited'?'⏳':'❌';}
};

/* ---------- start: open the last project (or migrate the old single project) ---------- */
applyFeatures();update(false);
(async()=>{
  (await dbAll('assets')).forEach(a=>{if(a&&a.id)ASSETS[a.id]=a;});
  (await dbAll('projects')).forEach(r=>{if(r&&r.id&&r.data)PROJ[r.id]=r;});
  if(!Object.keys(PROJ).length){let d=null;
    for(const key of ['adamak-v3','adamak-v2']){try{d=normalize(JSON.parse(localStorage.getItem(key)));}catch(e){d=null;}if(d)break;}
    const id=newId('p');PROJ[id]={id,created:Date.now(),updated:Date.now(),deleted:null,data:d||sample(),thumb:null};
    openProject(id);saveNow();return;}
  let id=null;try{id=localStorage.getItem('adamak-cur');}catch(e){}
  if(!id||!PROJ[id]||PROJ[id].deleted){const live=Object.values(PROJ).filter(r=>!r.deleted).sort((a,b)=>b.updated-a.updated);id=live.length?live[0].id:null;}
  if(id)openProject(id);else newProject();
})();
})();
